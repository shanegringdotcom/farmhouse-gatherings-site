[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the build image to a stable LTS so the SSR build + prerender run
  # the same way CI does locally.
  NODE_VERSION = "22"

# Send the default Netlify hostname to the live domain. This kills the duplicate
# copy of the site at biglongfarmhouse.netlify.app and keeps it out of analytics.
# Deploy Previews and branch deploys use a prefixed host
# (deploy-preview-N--biglongfarmhouse.netlify.app) so they are unaffected.
# Must stay above the SPA fallback — Netlify applies the first matching rule.
[[redirects]]
  from = "https://biglongfarmhouse.netlify.app/*"
  to = "https://biglongfarmhouse.com/:splat"
  status = 301
  force = true

# The inquiry form POSTs here. This rule has to sit above the `/*` catch-all:
# Netlify only checks for a matching static file on GET and HEAD, so a POST is
# handed straight to the redirect rules, and the catch-all below would answer it
# with the 404 shell instead of letting Netlify Forms record the submission.
# That is what "the form has never delivered a message" was.
[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

# /welcome is a real client-rendered route, so it must serve the SPA shell with a
# genuine 200. It stays out of the prerender list (and out of sitemap.xml) on
# purpose — that is what keeps it noindexed and private.
[[redirects]]
  from = "/welcome"
  to = "/index.html"
  status = 200

# Everything else that isn't a real file is a genuine 404. Serving the SPA shell
# with status = 404 lets React render the NotFound page while Google receives a
# real 404 instead of a soft 404 (previously every unknown path returned 200 with
# a full copy of the homepage, including the homepage's canonical tag).
# Prerendered routes (/, /about, /big-long-lake) and static assets are matched as
# files before redirects are applied, so they are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
